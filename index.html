<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minolovac - Optimiziran za mobitel</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #2d5a3b, #1e3a2f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #3b3f45;
            border-radius: 28px;
            padding: 20px 15px 20px 15px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 100%;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #ffd966;
            font-size: 1.8rem;
            text-shadow: 2px 2px 0 #7a4c1a;
        }

        .difficulty-panel {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            background: #2c2f36;
            border: none;
            padding: 6px 15px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.85rem;
        }

        .difficulty-btn.active {
            background: #ff914d;
            box-shadow: 0 0 0 2px #ffd966;
        }

        .info-panel {
            background: #2c2f36;
            border-radius: 60px;
            padding: 8px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: white;
            font-weight: bold;
        }

        .mine-counter, .restart-btn, .flag-counter {
            background: #1e1f24;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .restart-btn {
            background: #ff914d;
            cursor: pointer;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .board {
            display: grid;
            background-color: #5a5e6e;
            padding: 6px;
            border-radius: 12px;
            gap: 2px;
            justify-content: center;
            margin: 0 auto;
            width: fit-content;
        }

        .cell {
            aspect-ratio: 1 / 1;
            min-width: 40px;
            background-color: #b0b3c0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.15rem;
            cursor: pointer;
            box-shadow: inset 0 -1px 0 #7e8292, inset 1px 1px 0 #eef3ff;
        }

        @media (max-width: 650px) {
            .cell { min-width: 34px; font-size: 0.95rem; }
        }
        @media (max-width: 550px) {
            .cell { min-width: 30px; font-size: 0.9rem; }
        }
        @media (max-width: 480px) {
            .cell { min-width: 28px; font-size: 0.85rem; }
        }

        .cell.revealed {
            background-color: #dbdee8;
            box-shadow: inset 0 0 0 1px #9da0ae;
        }

        .cell.flagged::before {
            content: "🚩";
            font-size: 0.95rem;
        }

        .cell.revealed.flagged::before { content: ""; }
        .cell[data-value="1"] { color: #1e4d8f; }
        .cell[data-value="2"] { color: #2d6a2d; }
        .cell[data-value="3"] { color: #c92a2a; }
        .cell[data-value="4"] { color: #2c3e66; }
        .cell[data-value="5"] { color: #7a3e1f; }
        .cell[data-value="6"] { color: #3f7e7e; }
        .cell[data-value="7"] { color: black; }
        .cell[data-value="8"] { color: #5e2a5e; }

        .cell.bomb-revealed {
            background-color: #e03a3a;
            color: white;
        }
        .cell.bomb-revealed::after {
            content: "💣";
            font-size: 0.9rem;
        }

        .message-area {
            margin-top: 18px;
            background: #22252c;
            padding: 6px 12px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
            font-size: 0.85rem;
        }
        footer {
            font-size: 0.7rem;
            margin-top: 12px;
            color: #bbb;
        }
        .instruction {
            background: #1e1f24;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            margin-top: 5px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <h1>💣 MINOLOVAC</h1>
        
        <div class="difficulty-panel">
            <button class="difficulty-btn" data-diff="easy">🟢 LAGANO (8x8)</button>
            <button class="difficulty-btn active" data-diff="medium">🟡 SREDNJE (10x10)</button>
            <button class="difficulty-btn" data-diff="hard">🔴 TEŠKO (12x12)</button>
        </div>

        <div class="info-panel">
            <div class="mine-counter">💣 000</div>
            <button class="restart-btn" id="restartGame">😊 NOVA IGRA</button>
            <div class="flag-counter">🚩 000</div>
        </div>
        <div class="board" id="board"></div>
        <div class="message-area" id="statusMsg">🌟 Kratki dodir = otkrij | Dugi dodir = 🚩</div>
        <div class="instruction">📱 DUGI DODIR (pritisni i drži) za zastavicu</div>
    </div>
</div>

<script>
    const DIFFICULTY_SETTINGS = {
        easy:   { size: 8,  mines: 10 },
        medium: { size: 10, mines: 15 },
        hard:   { size: 12, mines: 28 }
    };
    
    let currentDifficulty = "medium";
    let BOARD_SIZE = 10, TOTAL_MINES = 15;
    let board = [], gameActive = true, firstMove = true;
    let boardElement = document.getElementById("board");
    
    function updateCounters() {
        let flagged = 0;
        for(let r=0; r<BOARD_SIZE; r++)
            for(let c=0; c<BOARD_SIZE; c++)
                if(board[r][c].flag) flagged++;
        document.querySelector(".mine-counter").innerText = `💣 ${String(TOTAL_MINES - flagged).padStart(3, '0')}`;
        document.querySelector(".flag-counter").innerText = `🚩 ${String(flagged).padStart(3, '0')}`;
    }
    
    function initEmptyBoard() {
        let b = [];
        for(let i=0; i<BOARD_SIZE; i++) {
            b[i] = [];
            for(let j=0; j<BOARD_SIZE; j++)
                b[i][j] = { mine: false, revealed: false, flag: false, neighborMines: 0 };
        }
        return b;
    }
    
    function placeMines(excludeRow, excludeCol) {
        let placed = 0;
        while(placed < TOTAL_MINES) {
            let r = Math.floor(Math.random() * BOARD_SIZE);
            let c = Math.floor(Math.random() * BOARD_SIZE);
            if((r===excludeRow && c===excludeCol)) continue;
            if(!board[r][c].mine) {
                board[r][c].mine = true;
                placed++;
            }
        }
        for(let r=0; r<BOARD_SIZE; r++) {
            for(let c=0; c<BOARD_SIZE; c++) {
                if(board[r][c].mine) { board[r][c].neighborMines = -1; continue; }
                let cnt = 0;
                for(let dr=-1; dr<=1; dr++)
                    for(let dc=-1; dc<=1; dc++)
                        if(dr||dc) {
                            let nr=r+dr, nc=c+dc;
                            if(nr>=0 && nr<BOARD_SIZE && nc>=0 && nc<BOARD_SIZE && board[nr][nc].mine) cnt++;
                        }
                board[r][c].neighborMines = cnt;
            }
        }
    }
    
    function revealEmpty(row, col) {
        if(row<0 || row>=BOARD_SIZE || col<0 || col>=BOARD_SIZE) return;
        let cell = board[row][col];
        if(cell.revealed || cell.flag || cell.mine) return;
        cell.revealed = true;
        if(cell.neighborMines === 0) {
            for(let dr=-1; dr<=1; dr++)
                for(let dc=-1; dc<=1; dc++)
                    if(dr||dc) revealEmpty(row+dr, col+dc);
        }
    }
    
    function checkWin() {
        for(let i=0; i<BOARD_SIZE; i++)
            for(let j=0; j<BOARD_SIZE; j++)
                if(!board[i][j].mine && !board[i][j].revealed) return;
        if(gameActive) {
            gameActive = false;
            document.getElementById("statusMsg").innerHTML = "🎉 POBJEDA! 🎉";
            for(let i=0;i<BOARD_SIZE;i++)
                for(let j=0;j<BOARD_SIZE;j++)
                    if(board[i][j].mine) board[i][j].flag = true;
            renderBoard();
        }
    }
    
    function revealCell(row, col) {
        if(!gameActive) return;
        let cell = board[row][col];
        if(cell.revealed) return;
        if(cell.flag) { return; }
        if(cell.mine) {
            cell.revealed = true;
            gameActive = false;
            document.getElementById("statusMsg").innerHTML = "💥 BOOM! Izgubio/la si! 💥";
            for(let i=0;i<BOARD_SIZE;i++)
                for(let j=0;j<BOARD_SIZE;j++)
                    if(board[i][j].mine) board[i][j].revealed = true;
            renderBoard();
            return;
        }
        if(cell.neighborMines === 0) revealEmpty(row, col);
        else cell.revealed = true;
        renderBoard();
        checkWin();
    }
    
    function toggleFlag(row, col) {
        if(!gameActive) return;
        let cell = board[row][col];
        if(cell.revealed) return;
        cell.flag = !cell.flag;
        updateCounters();
        renderBoard();
        checkWin();
    }
    
    function firstClickHandler(row, col) {
        if(!firstMove) return;
        if(board[row][col].flag) return;
        board = initEmptyBoard();
        placeMines(row, col);
        firstMove = false;
        revealCell(row, col);
    }
    
    function renderBoard() {
        boardElement.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
        let html = '';
        for(let i=0; i<BOARD_SIZE; i++) {
            for(let j=0; j<BOARD_SIZE; j++) {
                const cell = board[i][j];
                let classes = 'cell';
                let content = '';
                let dataValue = '';
                
                if(cell.revealed) {
                    classes += ' revealed';
                    if(cell.mine) {
                        classes += ' bomb-revealed';
                        content = '';
                    } else if(cell.neighborMines > 0) {
                        content = cell.neighborMines;
                        dataValue = `data-value="${cell.neighborMines}"`;
                    }
                } else if(cell.flag) {
                    classes += ' flagged';
                }
                
                html += `<div class="${classes}" data-row="${i}" data-col="${j}" ${dataValue}>${content}</div>`;
            }
        }
        boardElement.innerHTML = html;
        attachEvents();
    }
    
    function attachEvents() {
        document.querySelectorAll('.cell').forEach(el => {
            const row = parseInt(el.dataset.row);
            const col = parseInt(el.dataset.col);
            
            el.onclick = (e) => {
                e.stopPropagation();
                if(firstMove) firstClickHandler(row, col);
                else revealCell(row, col);
            };
            
            el.oncontextmenu = (e) => {
                e.preventDefault();
                toggleFlag(row, col);
            };
            
            let touchTimer = null;
            el.ontouchstart = (e) => {
                e.preventDefault();
                touchTimer = setTimeout(() => {
                    toggleFlag(row, col);
                    touchTimer = null;
                }, 500);
            };
            el.ontouchend = (e) => {
                e.preventDefault();
                if(touchTimer) {
                    clearTimeout(touchTimer);
                    if(firstMove) firstClickHandler(row, col);
                    else revealCell(row, col);
                    touchTimer = null;
                }
            };
            el.ontouchmove = () => {
                if(touchTimer) clearTimeout(touchTimer);
                touchTimer = null;
            };
        });
    }
    
    function newGame(difficulty) {
        currentDifficulty = difficulty;
        const set = DIFFICULTY_SETTINGS[difficulty];
        BOARD_SIZE = set.size;
        TOTAL_MINES = set.mines;
        gameActive = true;
        firstMove = true;
        board = initEmptyBoard();
        updateCounters();
        renderBoard();
        document.getElementById("statusMsg").innerHTML = "🌟 Kratki dodir = otkrij | Dugi dodir = 🚩";
    }
    
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            newGame(btn.dataset.diff);
        };
    });
    document.getElementById('restartGame').onclick = () => newGame(currentDifficulty);
    
    newGame('medium');
</script>
</body>
</html>
