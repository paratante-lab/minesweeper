<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minesweeper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    color: #eee;
  }
  h1 { font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 0.75rem; color: #e94560; }

  .level-bar { display: flex; gap: 8px; margin-bottom: 0.75rem; }
  .lvl-btn {
    padding: 6px 16px; border-radius: 20px;
    border: 2px solid #e94560; background: transparent;
    color: #e94560; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .lvl-btn.active, .lvl-btn:hover { background: #e94560; color: #fff; }

  .hud {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 440px;
    background: #16213e; border-radius: 12px;
    padding: 8px 16px; margin-bottom: 0.75rem;
    font-size: 14px; font-weight: 600;
  }
  .hud-item { display: flex; align-items: center; gap: 6px; }
  .reset-btn {
    background: #e94560; border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 18px; cursor: pointer; transition: transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .reset-btn:hover { transform: scale(1.1); }
  .reset-btn:active { transform: scale(0.95); }

  #grid {
    display: grid; gap: 3px;
    padding: 10px; background: #16213e;
    border-radius: 12px; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .cell {
    border-radius: 6px; background: #0f3460;
    border: 1px solid #1a4a80;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover { background: #1a4a80; }
  .cell:active { background: #0d2d50; }
  .cell.revealed {
    background: #0a2540; border-color: #0d2d50; cursor: default;
  }
  .cell.revealed:hover { background: #0a2540; }
  .cell.flagged { background: #0f3460; }
  .cell.mine-hit { background: #5c1a1a !important; border-color: #e94560 !important; }
  .n1{color:#4fc3f7} .n2{color:#81c784} .n3{color:#e94560}
  .n4{color:#ce93d8} .n5{color:#ff8a65} .n6{color:#4dd0e1}
  .n7{color:#f48fb1} .n8{color:#bdbdbd}

  /* OVERLAY */
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #16213e; border: 1px solid #e94560;
    border-radius: 16px; padding: 1.5rem;
    max-width: 300px; width: 90%;
    display: flex; flex-direction: column; gap: 12px;
    animation: popIn 0.2s ease;
  }
  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { font-size: 1.2rem; color: #e94560; }
  .modal p { font-size: 14px; color: #aaa; line-height: 1.5; }
  .modal-btn {
    padding: 10px 14px; border-radius: 10px;
    border: 1px solid #1a4a80; background: #0f3460;
    color: #eee; font-size: 14px; cursor: pointer;
    text-align: left; display: flex; align-items: center; gap: 10px;
    transition: background 0.15s;
  }
  .modal-btn:hover, .modal-btn.selected { background: #1a4a80; border-color: #e94560; }
  .modal-btn .icon { font-size: 20px; }
  .primary-btn {
    padding: 10px; border-radius: 10px;
    border: none; background: #e94560;
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
  }
  .primary-btn:hover { background: #c73652; }
</style>
</head>
<body>

<h1>💣 MINESWEEPER</h1>

<div class="level-bar">
  <button class="lvl-btn active" onclick="setLevel('easy')">Lagani 6×6</button>
  <button class="lvl-btn" onclick="setLevel('medium')">Srednji 8×8</button>
  <button class="lvl-btn" onclick="setLevel('hard')">Teški 10×10</button>
</div>

<div class="hud">
  <div class="hud-item">💣 <span id="mine-count">0</span></div>
  <button class="reset-btn" id="face-btn" onclick="newGame()">🙂</button>
  <div class="hud-item">⏱ <span id="timer">0</span>s</div>
</div>

<div id="grid"></div>

<!-- START MODAL -->
<div class="overlay" id="start-overlay">
  <div class="modal">
    <h2>💣 Minesweeper</h2>
    <p>Kako želiš upravljati ćelijama?</p>
    <button class="modal-btn selected" id="btn-ask" onclick="selectMode('ask')">
      <span class="icon">❓</span>
      <div><strong>Pitaj me svaki put</strong><br><small style="color:#aaa">Pop-up pri svakom kliku</small></div>
    </button>
    <button class="modal-btn" id="btn-flag" onclick="selectMode('flag')">
      <span class="icon">🚩</span>
      <div><strong>Dugi pritisak = zastavica</strong><br><small style="color:#aaa">Kratki klik otvara, dugi = zastava</small></div>
    </button>
    <button class="modal-btn" id="btn-open" onclick="selectMode('open')">
      <span class="icon">👆</span>
      <div><strong>Samo otvori</strong><br><small style="color:#aaa">Bez zastavica</small></div>
    </button>
    <button class="primary-btn" onclick="startGame()">Počni →</button>
  </div>
</div>

<!-- ACTION MODAL -->
<div class="overlay hidden" id="action-overlay">
  <div class="modal">
    <h2>Što želiš?</h2>
    <button class="modal-btn" onclick="doAction('open')"><span class="icon">👆</span> Otvori ćeliju</button>
    <button class="modal-btn" onclick="doAction('flag')"><span class="icon">🚩</span> Postavi zastavicu</button>
    <button class="modal-btn" onclick="doAction('cancel')" style="border-color:#555;color:#aaa"><span class="icon">✖</span> Odustani</button>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="overlay hidden" id="result-overlay">
  <div class="modal">
    <h2 id="result-title"></h2>
    <p id="result-msg"></p>
    <button class="primary-btn" onclick="newGame()">Igraj ponovo →</button>
  </div>
</div>

<script>
const LEVELS = {
  easy:   { size: 6,  mines: 6 },
  medium: { size: 8,  mines: 12 },
  hard:   { size: 10, mines: 20 }
};

let level = 'easy';
let mode = 'ask';
let board = [], revealed = [], flagged = [];
let gameOver = false, firstClick = true;
let timerInterval = null, seconds = 0;
let pendingCell = null;

// --- LEVEL ---
function setLevel(l) {
  level = l;
  document.querySelectorAll('.lvl-btn').forEach((b, i) => {
    b.classList.toggle('active', ['easy','medium','hard'][i] === l);
  });
  newGame();
}

// --- MODE ---
function selectMode(m) {
  mode = m;
  ['ask','flag','open'].forEach(x => {
    document.getElementById('btn-' + x).classList.toggle('selected', x === m);
  });
}

function startGame() {
  document.getElementById('start-overlay').classList.add('hidden');
  newGame();
}

// --- NEW GAME ---
function newGame() {
  clearInterval(timerInterval);
  seconds = 0;
  document.getElementById('timer').textContent = '0';
  document.getElementById('face-btn').textContent = '🙂';
  document.getElementById('result-overlay').classList.add('hidden');
  document.getElementById('action-overlay').classList.add('hidden');
  gameOver = false; firstClick = true; pendingCell = null;
  const { size, mines } = LEVELS[level];
  const total = size * size;
  board    = Array(total).fill(0);
  revealed = Array(total).fill(false);
  flagged  = Array(total).fill(false);
  document.getElementById('mine-count').textContent = mines;
  renderGrid();
}

// --- PLACE MINES (after first click) ---
function placeMines(safeIdx) {
  const { size, mines } = LEVELS[level];
  const total = size * size;
  let placed = 0;
  while (placed < mines) {
    const r = Math.floor(Math.random() * total);
    if (r !== safeIdx && board[r] !== 9) { board[r] = 9; placed++; }
  }
  for (let i = 0; i < total; i++) {
    if (board[i] === 9) continue;
    board[i] = neighbors(i, size).filter(n => board[n] === 9).length;
  }
}

function neighbors(idx, size) {
  const r = Math.floor(idx / size), c = idx % size, ns = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < size && nc >= 0 && nc < size) ns.push(nr * size + nc);
  }
  return ns;
}

// --- RENDER ---
function renderGrid() {
  const { size } = LEVELS[level];
  const g = document.getElementById('grid');
  const maxW = Math.min(window.innerWidth - 40, 440);
  const cellSize = Math.floor((maxW - 20 - (size - 1) * 3) / size);
  g.style.gridTemplateColumns = `repeat(${size}, ${cellSize}px)`;
  g.innerHTML = '';

  for (let i = 0; i < size * size; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.style.width  = cellSize + 'px';
    el.style.height = cellSize + 'px';
    el.style.fontSize = Math.max(12, Math.floor(cellSize * 0.45)) + 'px';

    if (revealed[i]) {
      el.classList.add('revealed');
      if (board[i] === 9) el.textContent = '💣';
      else if (board[i] > 0) { el.textContent = board[i]; el.classList.add('n' + board[i]); }
    } else if (flagged[i]) {
      el.classList.add('flagged');
      el.textContent = '🚩';
    }

    // click
    el.addEventListener('click', () => handleClick(i));
    // right click = flag
    el.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(i); });

    // long press for mobile
    let lt = null;
    el.addEventListener('touchstart', () => {
      lt = setTimeout(() => { clearTimeout(lt); lt = null; toggleFlag(i); }, 500);
    }, { passive: true });
    el.addEventListener('touchend',  () => { clearTimeout(lt); lt = null; }, { passive: true });
    el.addEventListener('touchmove', () => { clearTimeout(lt); lt = null; }, { passive: true });

    g.appendChild(el);
  }
}

// --- CLICK HANDLER ---
function handleClick(idx) {
  if (gameOver || revealed[idx] || flagged[idx]) return;
  if (mode === 'ask') { pendingCell = idx; document.getElementById('action-overlay').classList.remove('hidden'); return; }
  if (mode === 'flag') { toggleFlag(idx); return; }
  openCell(idx);
}

function doAction(action) {
  document.getElementById('action-overlay').classList.add('hidden');
  if (pendingCell === null || action === 'cancel') { pendingCell = null; return; }
  if (action === 'flag') toggleFlag(pendingCell);
  else openCell(pendingCell);
  pendingCell = null;
}

// --- FLAG ---
function toggleFlag(idx) {
  if (gameOver || revealed[idx]) return;
  flagged[idx] = !flagged[idx];
  const { mines } = LEVELS[level];
  document.getElementById('mine-count').textContent = mines - flagged.filter(Boolean).length;
  renderGrid();
  checkWin();
}

// --- OPEN ---
function openCell(idx) {
  if (firstClick) {
    firstClick = false;
    placeMines(idx);
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = seconds;
    }, 1000);
  }
  if (board[idx] === 9) {
    revealed[idx] = true;
    renderGrid();
    // mark the hit cell
    const cells = document.getElementById('grid').children;
    cells[idx].classList.add('mine-hit');
    endGame(false);
    return;
  }
  floodReveal(idx);
  renderGrid();
  checkWin();
}

function floodReveal(idx) {
  if (revealed[idx] || flagged[idx]) return;
  revealed[idx] = true;
  if (board[idx] === 0) {
    const { size } = LEVELS[level];
    neighbors(idx, size).forEach(n => floodReveal(n));
  }
}

// --- WIN/LOSE ---
function checkWin() {
  const { mines } = LEVELS[level];
  if (revealed.filter(v => !v).length === mines) endGame(true);
}

function endGame(win) {
  clearInterval(timerInterval);
  gameOver = true;
  document.getElementById('face-btn').textContent = win ? '😎' : '😵';
  if (!win) {
    const { size } = LEVELS[level];
    for (let i = 0; i < size * size; i++) if (board[i] === 9) revealed[i] = true;
  }
  renderGrid();
  setTimeout(() => {
    const ov = document.getElementById('result-overlay');
    document.getElementById('result-title').textContent = win ? '🎉 Pobjeda!' : '💥 Boom!';
    document.getElementById('result-msg').textContent = win
      ? `Riješio si za ${seconds} sekundi! Bravo!`
      : 'Nagazio si na minu. Nema veze, pokušaj ponovo!';
    ov.classList.remove('hidden');
  }, 600);
}

// init
newGame();
</script>
</body>
</html>
