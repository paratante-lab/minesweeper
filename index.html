<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minolovac - Ispravljena verzija</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #2d5a3b, #1e3a2f);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #3b3f45;
            border-radius: 28px;
            padding: 20px 15px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            margin: 0 0 5px;
            color: #ffd966;
            font-size: 1.8rem;
        }
        .difficulty-panel {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .difficulty-btn {
            background: #2c2f36;
            border: none;
            padding: 6px 15px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.1s;
        }
        .difficulty-btn.active {
            background: #ff914d;
            box-shadow: 0 0 0 2px #ffd966;
        }
        .difficulty-btn:active {
            transform: scale(0.95);
        }
        .info-panel {
            background: #2c2f36;
            border-radius: 60px;
            padding: 8px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: white;
            font-weight: bold;
        }
        .mine-counter, .restart-btn, .flag-counter {
            background: #1e1f24;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-family: monospace;
        }
        .restart-btn {
            background: #ff914d;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 0.95rem;
        }
        .board {
            display: grid;
            background: #5a5e6e;
            padding: 6px;
            border-radius: 12px;
            gap: 2px;
            justify-content: center;
            margin: 0 auto;
            width: fit-content;
        }
        .cell {
            aspect-ratio: 1 / 1;
            min-width: 40px;
            background: #b0b3c0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.15rem;
            cursor: pointer;
            box-shadow: inset 0 -1px 0 #7e8292, inset 1px 1px 0 #eef3ff;
        }
        @media (max-width: 650px) { .cell { min-width: 34px; font-size: 0.95rem; } }
        @media (max-width: 550px) { .cell { min-width: 30px; font-size: 0.9rem; } }
        @media (max-width: 480px) { .cell { min-width: 28px; font-size: 0.85rem; } }
        .cell.revealed {
            background: #dbdee8;
            box-shadow: inset 0 0 0 1px #9da0ae;
        }
        .cell.flagged::before { content: "🚩"; font-size: 0.95rem; }
        .cell.revealed.flagged::before { content: ""; }
        .cell[data-value="1"] { color: #1e4d8f; }
        .cell[data-value="2"] { color: #2d6a2d; }
        .cell[data-value="3"] { color: #c92a2a; }
        .cell[data-value="4"] { color: #2c3e66; }
        .cell[data-value="5"] { color: #7a3e1f; }
        .cell[data-value="6"] { color: #3f7e7e; }
        .cell[data-value="7"] { color: black; }
        .cell[data-value="8"] { color: #5e2a5e; }
        .cell.bomb-revealed { background: #e03a3a; color: white; }
        .cell.bomb-revealed::after { content: "💣"; font-size: 0.9rem; }
        .message-area {
            margin-top: 18px;
            background: #22252c;
            padding: 6px 12px;
            border-radius: 40px;
            color: #ffd966;
            font-size: 0.85rem;
        }
        .instruction {
            background: #1e1f24;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            margin-top: 5px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <h1>💣 MINOLOVAC</h1>
        <div class="difficulty-panel">
            <button class="difficulty-btn" data-diff="easy">🟢 LAGANO (8x8)</button>
            <button class="difficulty-btn active" data-diff="medium">🟡 SREDNJE (10x10)</button>
            <button class="difficulty-btn" data-diff="hard">🔴 TEŠKO (12x12)</button>
        </div>
        <div class="info-panel">
            <div class="mine-counter">💣 000</div>
            <button class="restart-btn" id="restartGame">😊 NOVA IGRA</button>
            <div class="flag-counter">🚩 000</div>
        </div>
        <div class="board" id="board"></div>
        <div class="message-area" id="statusMsg">⭐ KRATKI dodir = otkrij | DUGI dodir = zastavica</div>
        <div class="instruction">📱 DUGI DODIR (pritisni i drži 0.5s) za 🚩</div>
    </div>
</div>

<script>
(function(){
    const DIFFS = {
        easy:   { size: 8,  mines: 10 },
        medium: { size: 10, mines: 15 },
        hard:   { size: 12, mines: 28 }
    };
    
    let currentDiff = "medium";
    let size = 10, totalMines = 15;
    let grid = [];
    let active = true, first = true;
    let boardDiv = document.getElementById("board");
    let statusDiv = document.getElementById("statusMsg");
    let mineSpan = document.querySelector(".mine-counter");
    let flagSpan = document.querySelector(".flag-counter");
    
    function updateUI() {
        let flagged = 0;
        for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(grid[i][j].flag) flagged++;
        mineSpan.innerText = `💣 ${String(totalMines - flagged).padStart(3,'0')}`;
        flagSpan.innerText = `🚩 ${String(flagged).padStart(3,'0')}`;
    }
    
    function initEmpty() {
        let g = [];
        for(let i=0;i<size;i++) {
            g[i] = [];
            for(let j=0;j<size;j++) g[i][j] = { mine:false, revealed:false, flag:false, val:0 };
        }
        return g;
    }
    
    function placeMines(exR, exC) {
        let placed = 0;
        while(placed < totalMines) {
            let r = Math.floor(Math.random()*size);
            let c = Math.floor(Math.random()*size);
            if((r===exR && c===exC)) continue;
            if(!grid[r][c].mine) {
                grid[r][c].mine = true;
                placed++;
            }
        }
        for(let r=0;r<size;r++) {
            for(let c=0;c<size;c++) {
                if(grid[r][c].mine) { grid[r][c].val = -1; continue; }
                let cnt=0;
                for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) {
                    let nr=r+dr, nc=c+dc;
                    if(nr>=0 && nr<size && nc>=0 && nc<size && grid[nr][nc].mine) cnt++;
                }
                grid[r][c].val = cnt;
            }
        }
    }
    
    function revealEmpty(r,c) {
        if(r<0||r>=size||c<0||c>=size) return;
        let cell = grid[r][c];
        if(cell.revealed || cell.flag || cell.mine) return;
        cell.revealed = true;
        if(cell.val === 0) {
            for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr||dc) revealEmpty(r+dr,c+dc);
        }
    }
    
    function checkWin() {
        for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(!grid[i][j].mine && !grid[i][j].revealed) return;
        if(active) {
            active = false;
            statusDiv.innerHTML = "🎉 POBJEDA! Čestitamo! 🎉";
            for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(grid[i][j].mine) grid[i][j].flag = true;
            render();
        }
    }
    
    function revealCell(r,c) {
        if(!active) return;
        let cell = grid[r][c];
        if(cell.revealed) return;
        if(cell.flag) return;
        if(cell.mine) {
            cell.revealed = true;
            active = false;
            statusDiv.innerHTML = "💥 BOOM! Izgubio/la si! Pritisni NOVA IGRA 💥";
            for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(grid[i][j].mine) grid[i][j].revealed = true;
            render();
            return;
        }
        if(cell.val === 0) revealEmpty(r,c);
        else cell.revealed = true;
        render();
        checkWin();
    }
    
    function toggleFlag(r,c) {
        if(!active) return;
        let cell = grid[r][c];
        if(cell.revealed) return;
        cell.flag = !cell.flag;
        updateUI();
        render();
        checkWin();
    }
    
    function firstClick(r,c) {
        if(!first) return;
        if(grid[r][c].flag) return;
        grid = initEmpty();
        placeMines(r,c);
        first = false;
        revealCell(r,c);
    }
    
    function render() {
        boardDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        let html = '';
        for(let i=0;i<size;i++) {
            for(let j=0;j<size;j++) {
                const cell = grid[i][j];
                let cls = 'cell';
                let content = '';
                let dataVal = '';
                if(cell.revealed) {
                    cls += ' revealed';
                    if(cell.mine) {
                        cls += ' bomb-revealed';
                    } else if(cell.val > 0) {
                        content = cell.val;
                        dataVal = `data-value="${cell.val}"`;
                    }
                } else if(cell.flag) {
                    cls += ' flagged';
                }
                html += `<div class="${cls}" data-r="${i}" data-c="${j}" ${dataVal}>${content}</div>`;
            }
        }
        boardDiv.innerHTML = html;
        
        // PONOVNO VEŽI EVENTE NAKON RENDERANJA
        document.querySelectorAll('.cell').forEach(el => {
            const r = parseInt(el.dataset.r);
            const c = parseInt(el.dataset.c);
            
            // Miš
            el.onclick = (e) => {
                e.stopPropagation();
                if(first) firstClick(r,c);
                else revealCell(r,c);
            };
            el.oncontextmenu = (e) => {
                e.preventDefault();
                toggleFlag(r,c);
            };
            
            // Touch (mobitel)
            let timer = null;
            el.ontouchstart = (e) => {
                e.preventDefault();
                timer = setTimeout(() => { 
                    toggleFlag(r,c); 
                    timer = null; 
                }, 500);
            };
            el.ontouchend = (e) => {
                e.preventDefault();
                if(timer) {
                    clearTimeout(timer);
                    if(first) firstClick(r,c);
                    else revealCell(r,c);
                    timer = null;
                }
            };
            el.ontouchmove = () => { 
                if(timer) { 
                    clearTimeout(timer); 
                    timer = null; 
                } 
            };
        });
    }
    
    function newGame(diff) {
        currentDiff = diff;
        const s = DIFFS[diff];
        size = s.size;
        totalMines = s.mines;
        active = true;
        first = true;
        grid = initEmpty();
        updateUI();
        render();
        statusDiv.innerHTML = "⭐ KRATKI dodir = otkrij | DUGI dodir = zastavica";
    }
    
    document.querySelectorAll('.difficulty-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            newGame(btn.dataset.diff);
        };
    });
    document.getElementById('restartGame').onclick = () => newGame(currentDiff);
    
    newGame('medium');
})();
</script>
</body>
</html>
